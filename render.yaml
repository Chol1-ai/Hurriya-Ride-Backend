databases:
  - name: hurriya-ride-db
    databaseName: hurriya_ride
    user: hurriya_ride
    postgresMajorVersion: '16'
    plan: 0.1c-256mb
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: hurriya-ride-api
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hurriya-ride-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false